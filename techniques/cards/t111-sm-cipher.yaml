id: t111-sm-cipher
name: 国密 SM3/SM4 识别与逆向
domain: crypto
signal: 出现 256 字节表 + 32 轮 + 常量 0x79cc4519 之类，或程序注明国密
signal_en: SM3/SM4 constants or 32-round structure
distinguish: '与 AES/TEA 区分：SM4 是**32 轮 Feistel**，SM3 是国标哈希（256 位输出）。

  判据：看常量——SM4 有 0xa3b1bac6 等 4 个 FK；SM3 有 0x7380166f 等 IV。

  '
steps:
- SM4：找 FK 常量 0xa3b1bac6/0x56aa3350/0x677d9197/0xb27022dc
- SM4：CK 常量 32 个，形如 0x00070e15
- SM3：IV 常量 0x7380166f/0x4914b2b9/0x172442d7/0xda8a0600
- SM3：Tj 常量 0x79cc4519（j<16）/ 0x7a879d8a（j>=16）
- 拿国密标准实现改参数；Python 可用 gmssl 库
- 国密题常与硬件/固件题结合，先从固件里 dump 密钥
traps:
- SM4 的加密与解密轮函数相同，只是轮密钥反序
- SM3 的 P0/P1 置换容易写错，逐位对照标准文档
- 题目有时自定义 S-Box，需先比对国标 S-Box
- WP实证：试图不解 SM3 哈希扩展 → 失败：必须 64 字节块长 IV 复用
- WP实证：试图用 OpenSSL 解密 SM4 → 失败：必须用 gmssl
- WP实证：试图绕过 SM3 摘要校验 → 失败：必须保持完整结构
- WP实证：VeraCrypt 试 TrueCrypt 算法 → 失败：国密场景走 SM3
- WP实证：试图手工解 SM4 → 失败：SM4 复杂度比 AES 高，必须用 gmssl 库
- 'WP实证：试图直接调 SM4 标准库解 → 失败: SBOX 与线性变换都被改'
