<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">PNG 技法卡片使用示例</title><desc id="desc">观察 PNG 的 IHDR 与 CRC 异常，检查文件结构、验证宽高假设，再选择相应工具。</desc><rect width="1200" height="500" rx="12" fill="#121c28"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="48" y="58" fill="#f4f1e9" font-size="34" font-weight="600">技法卡片如何使用</text><text x="48" y="96" fill="#a8c4db" font-size="21" font-weight="400">内容示例 / t030-png-crc-width-height</text><rect x="48" y="126" width="1104" height="92" rx="10" fill="#1c2b3c"/><text x="72" y="162" fill="#e7c995" font-size="20" font-weight="400">观察信号</text><text x="72" y="196" fill="#f4f1e9" font-size="27" font-weight="400">PNG 打不开或显示不全，IHDR 宽高与 CRC 不匹配</text><rect x="48" y="244" width="356" height="176" rx="10" fill="#1c2b3c"/><text x="72" y="281" fill="#e7c995" font-size="22" font-weight="400">01</text><text x="72" y="321" fill="#f4f1e9" font-size="28" font-weight="600">检查结构</text><text x="72" y="362" fill="#f4f1e9" font-size="21" font-weight="400">读取 IHDR 宽高与记录的 CRC</text><text x="72" y="397" fill="#b4c1cf" font-size="18" font-weight="400">先区分文件头损坏与宽高被修改</text><rect x="422" y="244" width="356" height="176" rx="10" fill="#1c2b3c"/><text x="446" y="281" fill="#e7c995" font-size="22" font-weight="400">02</text><text x="446" y="321" fill="#f4f1e9" font-size="28" font-weight="600">验证假设</text><text x="446" y="362" fill="#f4f1e9" font-size="21" font-weight="400">用 CRC 校验候选宽高</text><text x="446" y="397" fill="#b4c1cf" font-size="18" font-weight="400">保留原始文件，对照原文与附件</text><rect x="796" y="244" width="356" height="176" rx="10" fill="#1c2b3c"/><text x="820" y="281" fill="#e7c995" font-size="22" font-weight="400">03</text><text x="820" y="321" fill="#f4f1e9" font-size="28" font-weight="600">选择工具</text><text x="820" y="362" fill="#f4f1e9" font-size="21" font-weight="400">pngcheck / 图片宽高修复脚本</text><text x="820" y="397" fill="#b4c1cf" font-size="18" font-weight="400">确认输入、搜索范围与运行依赖</text><text x="48" y="466" fill="#b4c1cf" font-size="21" font-weight="400">卡片提供方法线索；具体步骤仍需结合题目条件验证。</text></g></svg>