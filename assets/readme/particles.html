<script>
  const cover = document.querySelector('#cover');
  const canvas = cover.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const button = document.querySelector('#motion');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const particles = Array.from({ length: 82 }, () => ({
    x: Math.random(), y: Math.random(), phase: Math.random() * 2 * Math.PI
  }));
  let pointer = null;
  let running = !reducedMotion.matches;
  let frame;
  let width;
  let height;

  function render(time) {
    if (!width || !height) return;
    ctx.clearRect(0, 0, width, height);
    const points = particles.map(p => {
      let x = p.x * width + 15 * Math.sin(time / 1200 + p.phase);
      let y = p.y * height + 11 * Math.cos(time / 1500 + p.phase);
      if (pointer) {
        const dx = x - pointer.x;
        const dy = y - pointer.y;
        const distance = Math.hypot(dx, dy);
        if (distance > 0 && distance < 115) {
          const offset = (115 - distance) * 0.55 / distance;
          x += dx * offset;
          y += dy * offset;
        }
      }
      return { x, y };
    });
    points.forEach((p, index) => {
      ctx.fillStyle = index % 5 === 0 ? '#e7c995aa' : '#8bc4f49e';
      ctx.beginPath();
      ctx.arc(p.x, p.y, index % 5 === 0 ? 1.8 : 1.2, 0, Math.PI * 2);
      ctx.fill();
      for (let i = index + 1; i < points.length; i++) {
        const q = points[i];
        const distance = Math.hypot(p.x - q.x, p.y - q.y);
        if (distance >= 54) continue;
        ctx.strokeStyle = `rgba(139, 196, 244, ${0.20 * (1 - distance / 54)})`;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(q.x, q.y);
        ctx.stroke();
      }
    });
  }

  function animate(time) {
    render(time);
    frame = requestAnimationFrame(animate);
  }

  function setRunning(value) {
    running = value;
    cancelAnimationFrame(frame);
    button.textContent = running ? '暂停动画' : '播放动画';
    if (running) frame = requestAnimationFrame(animate);
  }

  new ResizeObserver(() => {
    const bounds = cover.getBoundingClientRect();
    width = bounds.width;
    height = bounds.height;
    const scale = Math.min(devicePixelRatio || 1, 2);
    canvas.width = width * scale;
    canvas.height = height * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    render(0);
  }).observe(cover);

  cover.addEventListener('pointermove', event => {
    const bounds = cover.getBoundingClientRect();
    pointer = { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
  });
  for (const event of ['pointerleave', 'pointerup', 'pointercancel']) {
    cover.addEventListener(event, () => { pointer = null; });
  }
  button.addEventListener('click', () => setRunning(!running));
  reducedMotion.addEventListener('change', event => setRunning(!event.matches));
  setRunning(running);
</script>
</html>
