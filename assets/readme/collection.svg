<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">知识库资源全景</title><desc id="desc">1049 篇 WP、67 张技法卡、2431 条技法原子、2866 条失败尝试、12 篇专题，以及 MCP 和数据工具。</desc><rect width="1200" height="700" rx="12" fill="#121c28"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif"><text x="48" y="58" fill="#f4f1e9" font-size="34" font-weight="600">资源全景</text><text x="48" y="94" fill="#b4c1cf" font-size="21" font-weight="400">按内容与用途组织的六类入口</text><rect x="48" y="123" width="538" height="146" rx="10" fill="#1c2b3c"/><text x="72" y="169" fill="#e7c995" font-size="36" font-weight="600">1049</text><text x="212" y="166" fill="#f4f1e9" font-size="26" font-weight="500">比赛 WriteUp</text><text x="72" y="209" fill="#c8d2de" font-size="22" font-weight="400">按题目、方向与比赛查阅解题过程</text><text x="72" y="243" fill="#a8c4db" font-size="18" font-weight="400">CTF大赛WP集合/articles/</text><rect x="614" y="123" width="538" height="146" rx="10" fill="#1c2b3c"/><text x="638" y="169" fill="#e7c995" font-size="36" font-weight="600">67</text><text x="778" y="166" fill="#f4f1e9" font-size="26" font-weight="500">技法卡片</text><text x="638" y="209" fill="#c8d2de" font-size="22" font-weight="400">观察信号、适用条件、步骤与陷阱</text><text x="638" y="243" fill="#a8c4db" font-size="18" font-weight="400">techniques/TECHNIQUES.md</text><rect x="48" y="293" width="538" height="146" rx="10" fill="#1c2b3c"/><text x="72" y="339" fill="#e7c995" font-size="36" font-weight="600">2431</text><text x="212" y="336" fill="#f4f1e9" font-size="26" font-weight="500">技法原子</text><text x="72" y="379" fill="#c8d2de" font-size="22" font-weight="400">从经验字段提取的长尾知识线索</text><text x="72" y="413" fill="#a8c4db" font-size="18" font-weight="400">techniques/ATOMS.md</text><rect x="614" y="293" width="538" height="146" rx="10" fill="#1c2b3c"/><text x="638" y="339" fill="#e7c995" font-size="36" font-weight="600">2866</text><text x="778" y="336" fill="#f4f1e9" font-size="26" font-weight="500">失败尝试记录</text><text x="638" y="379" fill="#c8d2de" font-size="22" font-weight="400">按失败原因检索相关案例</text><text x="638" y="413" fill="#a8c4db" font-size="18" font-weight="400">traps/TRAPS-INDEX.md</text><rect x="48" y="463" width="538" height="146" rx="10" fill="#1c2b3c"/><text x="72" y="509" fill="#e7c995" font-size="36" font-weight="600">12</text><text x="212" y="506" fill="#f4f1e9" font-size="26" font-weight="500">专题笔记</text><text x="72" y="549" fill="#c8d2de" font-size="22" font-weight="400">Web 漏洞、图片、压缩包与音频</text><text x="72" y="583" fill="#a8c4db" font-size="18" font-weight="400">各专题 .md 与 .idx.md</text><rect x="614" y="463" width="538" height="146" rx="10" fill="#1c2b3c"/><text x="638" y="509" fill="#e7c995" font-size="36" font-weight="600">MCP</text><text x="778" y="506" fill="#f4f1e9" font-size="26" font-weight="500">检索与数据工具</text><text x="638" y="549" fill="#c8d2de" font-size="22" font-weight="400">Agent 调用、语料导出与健康检查</text><text x="638" y="583" fill="#a8c4db" font-size="18" font-weight="400">mcp/ · tools/</text><text x="48" y="668" fill="#b4c1cf" font-size="19" font-weight="400">收录量来自当前仓库；派生记录未经逐条完整复现。</text></g></svg>